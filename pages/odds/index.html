        <h1>ODDS — Every chance leaves a trace.</h1>
        <p>This playground needs JavaScript to run experiments. The story is still here.</p>
        <ol>
          <li><h2>A ball, not yet fallen</h2><p>Eight independent choices lead to nine possible endpoints. A path records what happened once.</p></li>
          <li><h2>Left. Or right.</h2><p>At a fair fork, each direction has a one-half chance. Earlier left turns do not make a right turn due.</p></li>
          <li><h2>More paths than places</h2><p>Four choices make sixteen direction sequences. Six lead to the central endpoint.</p></li>
          <li><h2>The middle has more ways in</h2><p>Eight choices make 256 sequences. Their endpoint multiplicities are 1, 8, 28, 56, 70, 56, 28, 8, 1.</p></li>
          <li><h2>Small samples have character</h2><p>Two sets of sixteen balls can look different. The expected central count is 4.375, not a promised result.</p></li>
          <li><h2>A different leaning</h2><p>Changing p changes the chance of turning right at every level. It starts a separate experiment.</p></li>
          <li><h2>Same rules. Different evenings.</h2><p>Independent rounds differ. Larger samples are usually more stable, but each added ball need not move the shape closer to theory.</p></li>
          <li><h2>A portrait of 256</h2><p>Every ball in the portrait belongs to the same saved teaching round. Each retains its own path.</p></li>
          <li><h2>Give chance a set of rules</h2><p>The interactive workbench can use 4, 8 or 12 choices, right-turn probabilities of 0.25, 0.50 or 0.75, and 16, 64 or 256 samples.</p></li>
          <li><h2>Still worth watching</h2><p>Many journeys reveal a shape. The next one has not been promised.</p></li>
        </ol>
        <p>This is an ideal independent probability model using replayable pseudorandom samples. The animation is not measured collision physics.</p>
