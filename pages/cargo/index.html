    <noscript><main class="noscript-story"><h1>CARGO — One box. Many worlds.</h1><p>A steel rectangle crosses roads, rails, ports and open water without changing its shape. This interactive exhibit needs JavaScript for its controls. The complete story is also included as STORY.md in the source package.</p><ol><li>One Box: Meet BOX-001, our fictional red container.</li><li>Within the Walls: A finite interior holds six illustrative packing blocks.</li><li>Closed and Recorded: The same two doors close for departure.</li><li>Overland: A road chassis supports the box.</li><li>Intermodal: Change carriers while the cargo stays sealed.</li><li>Across the Land: A rail wagon carries the same corrugated walls.</li><li>The Yard: The selected box joins a landscape of grounded stacks.</li><li>The Lift: A spreader meets the top corners before the box rises.</li><li>Open Water: The box rests among the vessel's deck stacks.</li><li>Another Shore: A fictional receiving port sends it onward.</li><li>Open Again: The original doors reveal the original cargo arrangement.</li></ol></main></noscript>
