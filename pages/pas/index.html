        <h1>PAS</h1><p>The distance between two people.</p>
        <img src="%BASE_URL%pas/art/img-04.webp" alt="Cen in red offers a hand to Cheng in sand. Both stand barefoot on a matte floor." style="width:100%" />
        <p>One body makes a movement. Another gives it an answer. JavaScript enables the movement and observation controls. Here is the complete reading sequence.</p>
        <h2>1. Between</h2><p>Cen offers a hand. Cheng notices, then answers without touching.</p>
        <h2>2. Ground</h2><p>The feet stay grounded. Cen transfers a little weight and settles while Cheng watches.</p>
        <h2>3. One Palm</h2><p>The palms meet lightly. A change of direction receives an answer through the elbow and shoulder.</p>
        <h2>4. Counterweight</h2><p>A secure grip forms. Both lean modestly away, then return their weight before letting go.</p>
        <h2>5. Unison / Echo</h2><p>Lift, turn, return. The same independent phrase can begin together or a moment apart.</p>
        <h2>6. Make Room</h2><p>Two paths meet. Cheng shortens a step so Cen can pass, then continues.</p>
        <h2>7. Lower Together</h2><p>Their backs meet after turning. Knees and hips soften as both lower towards the ground.</p>
        <h2>8. A Complete Phrase</h2><p>Rise, release, receive weight. Cen waits; Cheng passes and looks back. A brief touch completes the phrase.</p>
        <h2>9. Let Go</h2><p>After finding their own support, the final fingers separate. A small shoulder movement still finds an answer.</p>
        <h2>10. Here, Again</h2><p>The distance remains. The waiting has changed.</p>
