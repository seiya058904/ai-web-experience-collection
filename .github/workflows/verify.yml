name: Verify

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '**/readme-*'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '**/readme-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      # Deployment parity: the Pages workflow builds under the project subpath.
      # verify:build rejects any reference that escapes that base, so subpath
      # link regressions (e.g. root-absolute /work/ anchors) fail here too.
      - run: npm run build -- --base=/ai-web-experience-collection/
      - run: npm run verify:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Keep failed browser evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
